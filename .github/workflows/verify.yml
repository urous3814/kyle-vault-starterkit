name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  starterkit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify starterkit structure
        run: bash scripts/verify-starterkit.sh

      - name: Verify skill package
        run: bash skill/kyle-vault-workspace/scripts/verify-starterkit.sh

      - name: Smoke test installer
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/repo"
          git -C "$tmp/repo" init
          bash skill/kyle-vault-workspace/scripts/install-starterkit.sh \
            --repo-root "$tmp/repo" \
            --workspace-root "$tmp" \
            --vault-name docs-vault \
            --with-onboarding
          test -d "$tmp/docs-vault/06-ops"
          test -f "$tmp/docs-vault/06-ops/ONBOARDING.md"
          test -L "$tmp/repo/kyle"
          bash "$tmp/repo/scripts/test-conductor-setup.sh"
